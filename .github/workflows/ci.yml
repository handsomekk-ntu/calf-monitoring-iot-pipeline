name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -v -m "not integration"

  integration:
    # Real Mosquitto broker: publisher -> broker -> backend bridge
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y mosquitto
      - run: mosquitto -p 18830 -d
      - run: pip install -r requirements-dev.txt
      - name: Broker round-trip test
        env:
          MQTT_TEST_PORT: "18830"
        run: pytest -v -m integration
      - name: Validate docker-compose file
        run: docker compose --env-file .env.example config -q
